<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f6f7f5">
    <meta name="description" content="A home for learning, sharing ideas, and building useful projects.">
    <title>My Edu — Learn, make, share</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <script src="site.config.js"></script>
    <script src="app.js" defer></script>
  </head>
  <body>
    <div class="site-shell">
      <aside class="sidebar" aria-label="Main navigation">
        <a class="brand" href="#dashboard" aria-label="My Edu home">
          <span class="brand-mark" aria-hidden="true">m<span>.</span></span>
          <span class="brand-name" id="brandName">my edu<span class="brand-period">.</span></span>
        </a>

        <div class="nav-caption">WORKSPACE</div>
        <nav class="main-nav">
          <a class="nav-link" href="#dashboard" data-route="dashboard">
            <span class="nav-icon" aria-hidden="true">▦</span><span>Dashboard</span>
          </a>
          <a class="nav-link" href="#about" data-route="about">
            <span class="nav-icon" aria-hidden="true">◉</span><span>About</span>
          </a>
          <a class="nav-link" href="#projects" data-route="projects">
            <span class="nav-icon" aria-hidden="true">⌘</span><span>Projects</span>
            <span class="nav-count" id="projectCount" hidden></span>
          </a>
          <a class="nav-link" href="#contact" data-route="contact">
            <span class="nav-icon" aria-hidden="true">↗</span><span>Contact us</span>
          </a>
        </nav>

        <div class="sidebar-bottom">
          <div class="sidebar-note">
            <span class="note-spark" aria-hidden="true">✳</span>
            <p>A little progress<br>every day adds up.</p>
            <span class="note-caption">KEEP EXPLORING</span>
          </div>
          <a class="profile-chip" href="#about">
            <span class="avatar">ME</span>
            <span class="profile-copy"><strong>My learning space</strong><small>Open to possibilities</small></span>
            <span class="profile-more" aria-hidden="true">···</span>
          </a>
        </div>
      </aside>

      <div class="workspace">
        <header class="topbar">
          <div class="breadcrumb"><span>Workspace</span><span class="crumb-slash">/</span><strong id="currentPage">Dashboard</strong></div>
          <div class="topbar-actions">
            <span class="today-label" id="todayLabel"></span>
            <a class="button button-dark button-small" id="cmsLink" href="https://www.sanity.io/manage" target="_blank" rel="noopener noreferrer">
              <span aria-hidden="true">✳</span> Open CMS
            </a>
          </div>
        </header>

        <main id="app" class="page-content" tabindex="-1">
          <div class="loading-state"><span class="loading-dot"></span> Preparing your space…</div>
        </main>

        <footer class="site-footer">
          <span>Made for curious minds.</span>
          <span>Learn something. Build something. <span class="footer-heart" aria-hidden="true">♥</span></span>
        </footer>
      </div>
    </div>
  </body>
</html>
